name: Android APK Release

on:
  # 仅手动触发：给一个已存在的 tag，构建签名 APK 并挂到对应的 GitHub Release。
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (e.g. v0.1.0)"
        required: true
        type: string

concurrency:
  group: android-apk-release-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  SOURCE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}

jobs:
  ensure-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - name: Resolve release tag
        shell: bash
        run: node scripts/emit-release-env.mjs --source-tag "$SOURCE_TAG" >> "$GITHUB_ENV"

      - name: Ensure GitHub release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if node scripts/github-release.mjs --repo "${{ github.repository }}" --tag "$RELEASE_TAG" >/dev/null 2>&1; then
            exit 0
          fi

          release_args=(
            release create "$RELEASE_TAG"
            --repo "${{ github.repository }}"
            --title "Osuna $RELEASE_TAG"
            --notes ""
            --draft
          )

          if [[ "$IS_PRERELEASE" == "true" ]]; then
            release_args+=(--prerelease)
          fi

          if ! gh "${release_args[@]}"; then
            echo "Release creation raced with another workflow; continuing."
            node scripts/github-release.mjs --repo "${{ github.repository }}" --tag "$RELEASE_TAG" >/dev/null
          fi

  publish-android-apk:
    needs: [ensure-release]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      APP_VARIANT: production
      # docs/release.md「安卓签名 keystore」一节记录的证书 SHA-256，apksigner 的小写无冒号写法。
      EXPECTED_CERT_SHA256: 3916afab5ba3eb34bf715843300a3042bca986079e8d33d038d6c5c178634ea9

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - name: Resolve release tag
        shell: bash
        run: node scripts/emit-release-env.mjs --source-tag "$SOURCE_TAG" >> "$GITHUB_ENV"

      # 标准 runner 只保证 14 GB 可用，node_modules、NDK 与 gradle 中间物加起来偏紧。
      - name: Free runner disk space
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install JS dependencies
        run: node scripts/npm-retry.mjs ci

      # Metro 打包要读 workspace 包的构建产物；终端 WebView HTML 从源码重新生成。
      - name: Build app dependencies
        run: |
          npm run build:app-deps
          npm run build:terminal-webview --workspace=@osuna/app

      # keystore 在依赖安装之后才落盘，且放在仓库目录之外。
      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_KEYSTORE_BASE64" ]]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is empty."
            exit 1
          fi
          keystore_path="$RUNNER_TEMP/osuna-release.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"
          echo "OSUNA_ANDROID_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"

      # 签名插件在 prebuild 时要看到全部四个变量才改 gradle，gradle 构建时再读一次取值。
      - name: Expo prebuild (Android)
        working-directory: packages/app
        env: &android_signing_env
          OSUNA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          OSUNA_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          OSUNA_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          npx expo prebuild --platform android --clean --no-install
          if ! grep -q "signingConfig signingConfigs.release" android/app/build.gradle; then
            echo "::error::Release signing was not injected. Check the ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD secrets."
            exit 1
          fi

      - name: Gradle assembleRelease
        working-directory: packages/app/android
        env: *android_signing_env
        run: |
          ./gradlew :app:assembleRelease \
            -x lint -x lintVitalAnalyzeRelease -x lintVitalRelease \
            -x generateReleaseLintModel -x generateReleaseLintVitalModel \
            --no-daemon --max-workers=2

      - name: Verify APK signing certificate
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          asset_path="$RUNNER_TEMP/osuna-${RELEASE_TAG}-android.apk"
          cp packages/app/android/app/build/outputs/apk/release/app-release.apk "$asset_path"

          build_tools_dir="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          certs="$("$build_tools_dir/apksigner" verify --print-certs "$asset_path")"
          echo "$certs"

          actual_sha256="$(printf '%s\n' "$certs" | sed -n 's/^.*certificate SHA-256 digest: //p' | sort -u)"
          if [[ "$actual_sha256" != "$EXPECTED_CERT_SHA256" ]]; then
            echo "::error::APK signing certificate does not match the Osuna release keystore."
            exit 1
          fi

          echo "asset_path=$asset_path" >> "$GITHUB_OUTPUT"

      - name: Upload APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_lookup="$(node scripts/github-release.mjs --repo "${{ github.repository }}" --tag "$RELEASE_TAG")"
          gh release upload "$release_lookup" "${{ steps.apk.outputs.asset_path }}" --clobber --repo "${{ github.repository }}"
