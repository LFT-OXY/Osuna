# Minimal Osuna daemon + web UI deployment.
#
# Open http://localhost:6777 after `docker compose up -d`.
# For any network-reachable deployment, change OSUNA_PASSWORD first.
services:
  osuna:
    image: ghcr.io/lft-oxy/osuna:latest
    container_name: osuna
    restart: unless-stopped
    ports:
      - "6777:6777"
    environment:
      OSUNA_PASSWORD: "change-me"
      # Add DNS names you use to reach this container. IPs and localhost are
      # already allowed by default.
      # OSUNA_HOSTNAMES: "osuna.example.com,.lan"
    volumes:
      # Persistent daemon state and agent credentials/config.
      - ./osuna-home:/home/osuna
      # Code visible to Osuna and the agents it launches.
      - ./workspace:/workspace
