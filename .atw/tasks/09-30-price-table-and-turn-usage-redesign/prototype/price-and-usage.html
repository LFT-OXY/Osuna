<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<title>价格表分组 + 每轮用量面板 · 原型</title>
<style>
/*
 * 数值来源：
 *   research/ui-tokens.md（源码解析，带 file:line）
 *   research/screens/dom-*.json（真实 App 的计算样式，Expo Web，zh-CN，2026-09-30）
 */
:root {
  --font: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono: SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
}
.theme-light {

  --surface2: #f4f4f5;
  --surface3: #e4e4e7;
  --sidebar: #fafafa;
  --sidebar-hover: #f1f1f1;
  --nav-selected: #eaeaea;
  --nav-selected-ring: #dadada;
  --card: #ffffff;
  --border: #e4e4e7;
  --border-accent: #d4d4d8;
  --border-input: #d4d4d8;
  --row-border: rgba(228, 228, 231, 0.5);
  --fg: #27272a;
  --muted: #71717b;
  --extra-muted: #a1a1aa;
  --accent: #1b4ed8;
  --accent-fg: #ffffff;
  --destructive: #c10007;
  --hover: rgba(0, 0, 0, 0.06);
  --success: #3e704a;
  --danger: #9d433b;
  --warning: #7b5d39;
  --surface-warning: rgba(245, 158, 11, 0.1);
  --amber: #f59e0b;
  --glass: rgba(255, 255, 255, 0.8);
  --dialog-footer: rgba(244, 244, 245, 0.7);
  --scrim: rgba(0, 0, 0, 0.18);
  --shadow-dialog: rgba(0, 0, 0, 0.45);
  --shadow-popover: rgba(0, 0, 0, 0.35);
  --inset-highlight: transparent;
  --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.04);
  color-scheme: light;
}
.theme-dark {
  --surface0: #0a0a0a;
  --surface1: #111111;
  --surface2: #171717;
  --surface3: #262626;
  --sidebar: #000000;
  --sidebar-hover: #0a0a0a;
  --nav-selected: #131313;
  --nav-selected-ring: #212121;
  --card: #111111;
  --border: #191919;
  --border-accent: #262626;
  --border-input: #1e1e1e;
  --row-border: rgba(25, 25, 25, 0.5);
  --fg: #f5f5f5;
  --muted: #818181;
  --extra-muted: #555555;
  --accent: #346bf1;
  --accent-fg: #ffffff;
  --destructive: #c44a4a;
  --hover: rgba(255, 255, 255, 0.08);
  --success: #6cb17b;
  --danger: #d8847b;
  --warning: #c09664;
  --surface-warning: rgba(245, 158, 11, 0.1);
  --amber: #f59e0b;
  --glass: rgba(17, 17, 17, 0.8);
  --dialog-footer: rgba(23, 23, 23, 0.7);
  --scrim: rgba(0, 0, 0, 0.35);
  --shadow-dialog: rgba(0, 0, 0, 0.9);
  --shadow-popover: rgba(0, 0, 0, 0.8);
  --inset-highlight: rgba(255, 255, 255, 0.04);
  --shadow-md: 0 4px 8px rgba(0, 0, 0, 0.2);
  color-scheme: dark;
}

/* ───────── 原型外壳（不属于 App） ───────── */
html, body { margin: 0; height: 100%; }
body.proto {
  background: #dcdce0;
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
}
body.proto.page-dark { background: #1d1d20; }
.proto-bar {
  position: sticky; top: 0; z-index: 50;
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px;
  padding: 10px 16px;
  background: rgba(250, 250, 252, 0.92);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid #d4d4d8;
  font-size: 12px; color: #3f3f46;
}
.page-dark .proto-bar { background: rgba(28, 28, 31, 0.92); border-color: #2a2a2e; color: #d4d4d8; }
.proto-bar .grp { display: flex; align-items: center; gap: 4px; }
.proto-bar .grp-label { color: #8a8a93; margin-right: 2px; }
.proto-bar button {
  font: inherit; color: inherit; cursor: pointer;
  border: 1px solid transparent; background: transparent;
  padding: 3px 8px; border-radius: 6px;
}
.proto-bar button:hover { background: rgba(0, 0, 0, 0.06); }
.page-dark .proto-bar button:hover { background: rgba(255, 255, 255, 0.08); }
.proto-bar button.on { background: #27272a; color: #fff; }
.page-dark .proto-bar button.on { background: #f4f4f5; color: #18181b; }
.proto-bar .sep { width: 1px; height: 16px; background: #c4c4ca; }
.page-dark .proto-bar .sep { background: #3a3a40; }
.proto-stage { padding: 24px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.proto-caption { font-size: 12px; color: #6b6b73; max-width: 1440px; text-align: center; line-height: 18px; }
.page-dark .proto-caption { color: #9a9aa3; }
.frame-holder { position: relative; }
.frame-shadow { box-shadow: 0 0 0 0.5px rgba(0, 0, 0, 0.25), 0 20px 60px -20px rgba(0, 0, 0, 0.35); border-radius: 10px; }
.frame-shadow.phone { border-radius: 28px; }
body.bare { background: transparent; }
body.bare .proto-stage { padding: 0; align-items: flex-start; }
body.bare .frame-shadow { box-shadow: none; border-radius: 0; }

/* ───────── App 画框 ───────── */
.frame {
  position: relative; overflow: hidden;
  background: var(--surface0); color: var(--fg);
  font-family: var(--font); font-size: 14px;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  border-radius: 10px;
  transform-origin: top left;
}
.frame.phone { border-radius: 28px; }
body.bare .frame { border-radius: 0; }
.frame *, .frame *::before, .frame *::after { box-sizing: border-box; }
.frame::after {
  content: ""; position: absolute; inset: 0; z-index: 9999; pointer-events: none;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");
  background-repeat: repeat; background-size: 256px 256px;
}
.frame .scroll { scrollbar-width: thin; scrollbar-color: color-mix(in srgb, var(--extra-muted) 40%, transparent) transparent; }
.frame .scroll::-webkit-scrollbar { width: 8px; height: 8px; background: transparent; }
.frame .scroll::-webkit-scrollbar-thumb { border: 2px solid transparent; border-radius: 999px; background: color-mix(in srgb, var(--extra-muted) 40%, transparent); background-clip: content-box; }
.frame .no-scrollbar { scrollbar-width: none; }
.frame .no-scrollbar::-webkit-scrollbar { display: none; }
:where(.frame) button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; text-align: inherit; }
:where(.frame) input { font: inherit; }
:where(.frame) a { color: inherit; text-decoration: none; }
.frame svg { display: block; flex-shrink: 0; }
.frame .mono { font-family: var(--mono); }
.ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }

.app { display: flex; width: 100%; height: 100%; }

/* ───────── 设置侧栏（settings-screen.tsx） ───────── */
.snav { width: 320px; flex-shrink: 0; height: 100%; display: flex; flex-direction: column; background: var(--sidebar); border-right: 1px solid var(--border); }
.snav-chrome { height: 45px; position: relative; flex-shrink: 0; }
.traffic { position: absolute; left: 16px; top: 14px; display: flex; gap: 8px; }
.traffic i { width: 12px; height: 12px; border-radius: 50%; display: block; box-shadow: inset 0 0 0 0.5px rgba(0, 0, 0, 0.18); }
.traffic i:nth-child(1) { background: #ff5f57; }
.traffic i:nth-child(2) { background: #febc2e; }
.traffic i:nth-child(3) { background: #28c840; }
.snav-back { height: 36px; padding: 0 12px; display: flex; align-items: center; flex-shrink: 0; }
.snav-back .rowmd { flex: 1; min-height: 36px; padding: 8px; gap: 8px; display: flex; align-items: center; border-radius: 8px; color: var(--muted); font-size: 13px; line-height: 18px; }
.snav-scroll { flex: 1; overflow: hidden; }
.snav-list { padding: 8px; display: flex; flex-direction: column; gap: 4px; }
.snav-label { padding: 4px 8px; font-size: 12px; line-height: 16px; font-weight: 500; color: var(--muted); }
.snav-item { min-height: 32px; padding: 6px 8px; gap: 8px; display: flex; align-items: center; border-radius: 8px; color: var(--muted); font-size: 13px; line-height: 18px; }
.snav-item:hover { background: var(--sidebar-hover); color: var(--fg); }
.snav-item.sel { background: var(--nav-selected); box-shadow: inset 0 0 0 1px var(--nav-selected-ring); color: var(--fg); }
.snav-host { color: var(--fg); }
.snav-host .hdot { width: 16px; height: 16px; display: flex; align-items: center; justify-content: center; }
.snav-host .hdot i { width: 8px; height: 8px; border-radius: 4px; background: var(--success); display: block; }
.snav-host .chev { margin-left: auto; color: var(--muted); transform: translateY(1px); }

/* ───────── 内容区头部（ScreenHeader） ───────── */
.pane { flex: 1; min-width: 0; height: 100%; display: flex; flex-direction: column; }
.shdr { height: 36px; flex-shrink: 0; padding: 0 12px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid transparent; background: var(--surface0); }
.hbadge { width: 26px; height: 26px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: var(--muted); }
.stitle { font-size: 14px; font-weight: 300; line-height: normal; color: var(--fg); white-space: nowrap; }
.crumb-parent { font-size: 14px; font-weight: 300; color: var(--muted); border-radius: 6px; padding: 2px 4px; margin: 0 -4px; }
.crumb-parent:hover { color: var(--fg); background: var(--hover); }
.crumb-sep { font-size: 14px; font-weight: 300; color: var(--extra-muted); }
.pscroll { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; position: relative; }

/* 现有设置页内容列：maxWidth 720，padding 16，paddingTop 24 */
.column { width: 100%; max-width: 720px; margin: 0 auto; padding: 24px 16px 48px; }

/* 新布局：列表列 280 + 间距 24 + 详情列（最大 720），整体居中 */
.split { display: flex; align-items: flex-start; gap: 24px; width: 100%; max-width: 1056px; margin: 0 auto; padding: 24px 16px 48px; }
.list-col { width: 280px; flex-shrink: 0; position: sticky; top: 24px; }
.detail-col { flex: 1; min-width: 0; max-width: 720px; }

/* ───────── SettingsSection / 卡片 / 行（styles/settings.ts） ───────── */
.sec { margin-bottom: 24px; }
.sec:last-child { margin-bottom: 0; }
.sec-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 0 0 8px 2px; min-height: 18px; }
.sec-title { font-size: 13px; line-height: 18px; font-weight: 500; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.sec-count { font-weight: 500; color: var(--extra-muted); }
.sec-trail { display: flex; align-items: center; gap: 8px; }
.sec-c { display: flex; flex-direction: column; gap: 12px; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 56px; padding: 8px 16px; }
.card > * + * { border-top: 1px solid var(--row-border); }
.row-content { flex: 1; min-width: 0; }
.row-lead { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; }
.row-title { font-size: 14px; line-height: 20px; color: var(--fg); }
.row-hint { font-size: 12px; line-height: 16px; color: var(--muted); margin-top: 2px; }
.caption { font-size: 12px; line-height: 16px; }
.muted { color: var(--muted); }
.fg { color: var(--fg); }
.iconframe { width: 28px; height: 28px; border-radius: 6px; background: var(--surface2); display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: var(--fg); }
.iconframe.lg { width: 40px; height: 40px; border-radius: 10px; }
.trail { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

/* ───────── 状态点 / 徽章 ───────── */
.st { display: flex; align-items: center; gap: 6px; min-width: 0; }
.dot { width: 6px; height: 6px; border-radius: 3px; flex-shrink: 0; }
.dot.success { background: var(--success); }
.dot.warning { background: var(--warning); }
.dot.danger { background: var(--danger); }
.dot.muted { background: var(--muted); }
.spin { animation: spin 0.75s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.badge { display: inline-flex; align-items: center; gap: 6px; border-radius: 9999px; border: 1px solid var(--border); background: var(--surface3); padding: 3px 8px; font-size: 12px; line-height: normal; color: var(--muted); white-space: nowrap; }
.badge.success { color: var(--success); }
.badge.warning { color: var(--warning); }
.badge.danger { color: var(--danger); }

/* ───────── Switch（components/ui/switch.tsx） ───────── */
.sw-wrap { min-height: 32px; display: flex; align-items: center; flex-shrink: 0; }
.sw { width: 32px; height: 18px; border-radius: 9px; padding: 2px; background: var(--surface3); display: flex; align-items: center; transition: background-color 180ms ease-in-out; }
.sw i { width: 14px; height: 14px; border-radius: 7px; background: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.25); display: block; transition: transform 180ms ease-in-out; }
.sw.on { background: var(--accent); }
.sw.on i { transform: translateX(14px); }

/* ───────── Button（components/ui/button.tsx） ───────── */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid transparent; border-radius: 8px; font-size: 14px; line-height: normal; white-space: nowrap; flex-shrink: 0; color: var(--fg); min-height: 28px; padding: 0 12px; }
.btn.md { min-height: 32px; padding: 0 16px; }
.btn.xs { min-height: 24px; border-radius: 6px; font-size: 12px; }
.btn.default { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn.secondary { background: var(--surface3); border-color: var(--surface3); }
.btn.outline { border-color: var(--border-accent); }
.btn.outline:hover { background: var(--hover); }
.btn.ghost { color: var(--muted); }
.btn.ghost:hover { background: var(--hover); color: var(--fg); }
.btn.icon { padding: 0 12px; }
.btn.square { width: 28px; padding: 0; }
.btn:active { opacity: 0.85; }
.btn.w92 { width: 92px; }
.iconbtn { width: 28px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: var(--muted); flex-shrink: 0; }
.iconbtn:hover, .iconbtn.open { background: var(--surface2); color: var(--fg); }
.link { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); font-size: 12px; line-height: 16px; }
.link:hover { color: var(--fg); }

/* ───────── 提供方列表行 ───────── */
.prow { cursor: pointer; }
.prow .row-lead { gap: 12px; }
.prow:hover { background: var(--surface2); }
.prow.sel { background: var(--surface2); }
.prow .st-line { display: flex; align-items: center; gap: 6px; margin-top: 2px; font-size: 12px; line-height: 16px; color: var(--muted); min-width: 0; }
.prow .chev { color: var(--muted); }
.prow:hover .chev { color: var(--fg); }

/* ───────── 详情头部 ───────── */
.dhead { display: flex; align-items: center; gap: 12px; margin: 0 0 24px; min-height: 40px; }
.dhead-text { flex: 1; min-width: 0; }
.dhead-name { font-size: 16px; line-height: 24px; color: var(--fg); }
.dhead-meta { display: flex; align-items: center; gap: 8px; margin-top: 2px; font-size: 12px; line-height: 16px; color: var(--muted); }
.dhead-actions { display: flex; align-items: center; gap: 8px; position: relative; }

/* ───────── Alert（components/ui/alert.tsx） ───────── */
.alert { display: flex; align-items: flex-start; gap: 12px; border: 1px solid var(--border); border-radius: 12px; padding: 12px 16px; }
.alert .a-icon { padding-top: 2px; }
.alert .a-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.alert .a-title { font-size: 14px; font-weight: 500; line-height: normal; }
.alert .a-desc { font-size: 12px; line-height: 16px; color: var(--muted); overflow-wrap: anywhere; }
.alert .a-actions { display: flex; gap: 8px; margin-top: 8px; }
.alert.error { border-color: var(--destructive); }
.alert.error .a-icon, .alert.error .a-title { color: var(--destructive); }
.alert.warning { border-color: transparent; background: var(--surface-warning); border-radius: 8px; }
.alert.warning .a-icon, .alert.warning .a-title { color: var(--amber); }

/* ───────── 分段控件（segmented-control.tsx，sm） ───────── */
.seg { display: inline-flex; align-items: center; gap: 2px; min-height: 28px; padding: 2px; border-radius: 8px; background: var(--surface2); }
.seg button { min-height: 24px; padding: 0 8px; border-radius: 6px; font-size: 14px; line-height: normal; color: var(--muted); display: flex; align-items: center; }
.seg button:hover { background: var(--hover); }
.seg button.on { background: var(--surface3); color: var(--fg); }

/* ───────── 模型区 ───────── */
.msearch { display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 16px; color: var(--muted); }
.msearch input { flex: 1; border: 0; outline: 0; background: transparent; font: inherit; font-size: 14px; line-height: 20px; color: var(--fg); padding: 10px 0; }
.msearch input::placeholder { color: var(--muted); }
.mgroup { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px 6px; font-size: 12px; line-height: 16px; font-weight: 500; color: var(--muted); }
.card > .mgroup + .mrow { border-top: 0; }
.mrow { display: flex; align-items: center; gap: 12px; padding: 8px 16px; min-height: 34px; }
.mrow .m-name { font-size: 14px; line-height: normal; color: var(--fg); flex-shrink: 0; }
.mrow .m-id { font-family: var(--mono); font-size: 12px; line-height: normal; color: var(--muted); flex-shrink: 0; }
.mrow .m-desc { font-size: 12px; line-height: normal; color: var(--muted); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mrow .m-fill { flex: 1; }
.mrow .m-del { width: 28px; height: 28px; border-radius: 9999px; display: flex; align-items: center; justify-content: center; color: var(--destructive); margin: -6px -6px -6px 0; }
.mrow .m-del:hover { background: var(--surface2); }
.madd { display: flex; align-items: center; gap: 8px; padding: 10px 16px; }
.empty { padding: 32px 16px; display: flex; flex-direction: column; align-items: center; gap: 12px; color: var(--muted); font-size: 14px; line-height: 20px; text-align: center; }

/* ───────── 表单输入（form-field.tsx，sm） ───────── */
.input { flex: 1; min-width: 0; display: flex; align-items: center; min-height: 28px; padding: 3px 12px; border-radius: 8px; background: var(--surface2); border: 1px solid var(--border-input); }
.input input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; padding: 0; font: inherit; font-size: 14px; line-height: 20px; color: var(--fg); }
.input input::placeholder { color: var(--muted); }
.input.focus { border-color: var(--border-accent); outline: 2px solid var(--accent); outline-offset: 1px; }

/* ───────── 代码面（scrollable-code-surface.tsx） ───────── */
.code { font-family: var(--mono); font-size: 12px; line-height: 18px; color: var(--fg); padding: 12px 16px; background: var(--surface1); border: 1px solid var(--border); border-radius: 8px; white-space: pre; overflow-x: auto; }
.code .k { color: var(--muted); }

/* ───────── 下拉菜单（components/ui/menu） ───────── */
.menu { position: absolute; z-index: 40; min-width: 180px; padding: 4px 0; background: var(--glass); -webkit-backdrop-filter: blur(12px) saturate(1.14); backdrop-filter: blur(12px) saturate(1.14); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 16px 40px -18px var(--shadow-popover), inset 0 1px 0 var(--inset-highlight); overflow: hidden; }
.mi { display: flex; align-items: center; gap: 8px; min-height: 30px; margin: 0 4px; padding: 4px 8px; border: 1px solid transparent; border-radius: 6px; font-size: 14px; line-height: 18px; color: var(--fg); width: calc(100% - 8px); }
.mi:hover, .mi.hl { background: var(--hover); }
.mi .mi-icon { width: 16px; display: flex; justify-content: center; color: var(--muted); }
.mi.danger { color: var(--destructive); }
.mi.danger .mi-icon { color: var(--danger); }
.msep { height: 1px; margin: 4px 6px; background: var(--border); }

/* ───────── 弹窗（adaptive-modal-sheet.tsx） ───────── */
.overlay { position: absolute; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center; padding: 24px; }
.scrim { position: absolute; inset: 0; background: var(--scrim); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); }
.dialog { position: relative; width: 100%; max-width: 520px; max-height: 85%; display: flex; flex-direction: column; overflow: hidden; background: var(--glass); -webkit-backdrop-filter: blur(12px) saturate(1.14); backdrop-filter: blur(12px) saturate(1.14); border: 1px solid var(--border); border-radius: 18px; box-shadow: 0 24px 64px -24px var(--shadow-dialog), inset 0 1px 0 var(--inset-highlight); }
.dlg-head { border-bottom: 1px solid var(--border); flex-shrink: 0; }
.dlg-row { display: flex; align-items: center; gap: 8px; padding: 16px 24px; }

const params = new URLSearchParams(location.search);

// ───────── 价格表状态 ─────────
const P = {};
function resetPrice(set = {}) {
  P.models = PRICE_MODELS_INITIAL.map((m) => ({ ...m, origin: m.priceSource, price: m.price && { ...m.price } }));
  if (set.allPriced) {
    P.models = P.models.filter((m) => m.priceSource === "table");
  }
  P.drafts = {};
  P.editing = new Set(set.edit || []);
  P.errors = { ...(set.errors || {}) };
  P.liteOpen = !!set.liteOpen;
  P.query = set.query || "";
  P.forceHover = set.forceHover || null;
  P.pinned = new Set(); // 从 LiteLLM 组点「自定义」后临时进入自定义组的模型
  for (const [m, d] of Object.entries(set.drafts || {})) P.drafts[m] = { ...d };
  for (const m of P.editing) {
    const row = P.models.find((x) => x.model === m);
    if (row && !P.drafts[m]) P.drafts[m] = draftOf(row.price);
  }
}
function applyScreen(id) {
  const sc = SCREENS.find((x) => x.id === id) || SCREENS[0];
  S.screen = sc.id;
  S.tipOpen = true;
  resetPrice(sc.set || {});
}
const screen = () => SCREENS.find((x) => x.id === S.screen) || SCREENS[0];

// ───────── 小工具 ─────────
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
function icon(name, size = 16, extra = "") {
  const svg = ICONS[name];
  if (!svg) return `<span style="width:${size}px;height:${size}px;display:inline-block"></span>`;
  return svg.replace("<svg", `<svg width="${size}" height="${size}" ${extra}`);
}
function fmtPrice(v) {
  if (!Number.isFinite(v)) return "—";
  if (v === 0) return "0";
  const t = v.toFixed(6).replace(/0+$/, "").replace(/\.$/, "");
  return t === "0" ? "<0.000001" : t;
}
function draftOf(price) {
  const d = {};
  for (const f of PRICE_FIELDS) d[f.field] = price ? fmtPrice(price[f.field]) : "";
  return d;
}
function parseDraft(d) {
  const out = {};
  for (const f of PRICE_FIELDS) {
    const t = (d?.[f.field] ?? "").trim();
    const v = Number(t);
    if (t === "" || !Number.isFinite(v) || v < 0) return null;
    out[f.field] = v;
  }
  return out;
}
const tok = (v) => {
  const r = Math.round(v);
  if (Math.abs(r) >= 1e9) return (r / 1e9).toFixed(1) + "B";
  if (Math.abs(r) >= 1e6) return (r / 1e6).toFixed(1) + "M";
  if (Math.abs(r) >= 1e3) return (r / 1e3).toFixed(1) + "K";
  return String(r);
};
const cost = (v) => (!Number.isFinite(v) || v <= 0 ? "$0.00" : v < 0.01 ? "$" + v.toFixed(4) : "$" + v.toFixed(2));
function dur(ms) {
  const s = Math.floor(ms / 1000);
  if (s < 60) return `${s}s`;
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), r = s % 60;
  if (h) return m ? `${h}h ${m}m` : `${h}h`;
  return r ? `${m}m ${r}s` : `${m}m`;
}
const sw = (on, act) => `<div class="sw-wrap" data-act="${act}"><div class="sw ${on ? "on" : ""}"><i></i></div></div>`;

// 分组：自定义组 = 无价格 + 自定义价 + 临时从 LiteLLM 拉进来编辑的
function isCustomGroup(m) {
  return m.priceSource !== "table" || P.pinned.has(m.model);
}
function customRows() {
  const rows = P.models.filter(isCustomGroup);
  // 无价格在前，自定义在后
  return rows.sort((a, b) => (a.priceSource === null ? 0 : 1) - (b.priceSource === null ? 0 : 1));
}
function liteRows() {
  const q = P.query.trim().toLowerCase();
  return P.models.filter((m) => !isCustomGroup(m) && (!q || m.model.toLowerCase().includes(q)));
}
const liteTotal = () => P.models.filter((m) => !isCustomGroup(m)).length;
const isEditing = (m) => m.priceSource === null || P.editing.has(m.model);

function section({ title, count, trail = "", body, toggle, open, sub }) {

function currentPriceTable() {

function priceInput(m, f) {
  const d = P.drafts[m.model] || draftOf(null);

  return `<label class="pin ${bad ? "bad" : ""}"><span class="cur">$</span><input inputmode="decimal" placeholder="0.00" value="${esc(d[f.field] ?? "")}" data-draft="${esc(m.model)}" data-field="${f.field}" aria-label="${esc(m.model)} ${f.label}" /></label>`;

  }
  return `<div class="app">${settingsSidebar()}<div class="pane">
    <div class="shdr"><div class="hbadge">${icon("gauge", 16)}</div><span class="stitle">价格表</span></div>
    <div class="pscroll scroll"><div class="column">${content}</div></div></div></div>`;
}

// ═════════ 每轮用量面板 ═════════
function totalsOf(turn) {
  const t = { input: 0, cache: 0, output: 0, reasoning: 0, cost: 0, priced: true };
  for (const r of turn.rows) {
    t.input += r.input; t.cache += r.cache; t.output += r.output; t.reasoning += r.reasoning; t.cost += r.cost;
    t.priced = t.priced && r.priced;
  }
  return t;
}
function tipCurrent(turn) {
  const t = totalsOf(turn);
  const cells = (a, cls = "") => {
    const out = a.reasoning > 0 ? `${tok(a.output)} （${tok(a.reasoning)} 推理）` : tok(a.output);
    return `<span class="n ${cls}">${tok(a.input)}</span><span class="n ${cls}">${tok(a.cache)}</span><span class="n ${cls}">${out}</span><span class="n ${cls}">${cost(a.cost)}</span>`;
  };
  const rows = turn.rows
    .map((r) => `<div class="r"><div class="m"><span class="nm">${esc(r.model)}</span>${r.priced ? "" : `<span class="amber">无价格数据</span>`}</div>${cells(r)}</div>`)
    .join("");
  const total = turn.rows.length >= 2 ? `<div class="r"><span class="m tot">合计</span>${cells(t, "tot")}</div>` : "";
  return `<div class="tip cur" data-tip><div class="tc">
    <div class="title">本轮用量</div>
    <div class="r"><span class="m h">模型</span><span class="n h">输入</span><span class="n h">缓存</span><span class="n h">输出</span><span class="n h">估算成本</span></div>
    ${rows}${total}
    <div class="dur"><span class="h" style="color:var(--muted)">耗时</span><span class="tnum">${dur(turn.durationMs)}</span></div>
    <div class="note">估算成本 · 按公开 API 价格计算</div></div></div>`;
}
function tipOverview(turn) {
  const t = totalsOf(turn);
  const stats = [["输入", tok(t.input)], ["缓存", tok(t.cache)], ["输出", tok(t.output)]];
  if (t.reasoning > 0) stats.push(["其中推理", tok(t.reasoning)]);
  const unpriced = turn.rows.filter((r) => !r.priced);
  let models;
  if (turn.rows.length === 1) {
    const r = turn.rows[0];
    models = `<div class="ov-sep"></div><div class="ov-single"><span class="k">模型</span><span class="ellipsis">${esc(r.model)}</span></div>`;
  } else {
    models = `<div class="ov-sep"></div><div class="ov-models"><div class="ov-mh">按模型</div>${turn.rows
      .map(
        (r) => `<div class="ov-m"><div class="l1"><span class="nm">${esc(r.model)}</span><span class="c ${r.priced ? "" : "none"}">${r.priced ? cost(r.cost) : "无价格"}</span></div>
        <div class="l2">↑${tok(r.input)} · 缓存 ${tok(r.cache)} · ↓${tok(r.output)}${r.reasoning ? `（推理 ${tok(r.reasoning)}）` : ""}</div></div>`,
      )
      .join("")}</div>`;
  }
  const warn = unpriced.length
    ? `<div class="warn"><span class="dot amber"></span><span>${unpriced.map((r) => esc(r.model)).join("、")} 没有价格数据，按 $0 计入。可在 设置 › 价格表 自定义。</span></div>`
    : "";
  return `<div class="tip ov" data-tip>
    <div class="ov-top">
      <div class="ov-h"><span>本轮用量</span><span class="dur">${icon("clock", 12)}${dur(turn.durationMs)}</span></div>
      <div class="ov-cost"><span class="v ${t.priced ? "" : "unp"}">${cost(t.cost)}</span><span class="k">估算成本</span></div>
      <div class="ov-stats">${stats.map(([k, v]) => `<div class="ov-stat"><div class="k">${k}</div><div class="v">${v}</div></div>`).join("")}</div>
    </div>
    ${models}
    <div class="ov-sep"></div>
    <div class="ov-foot">${warn}<span>估算成本 · 按公开 API 价格计算</span></div>
  </div>`;
}
function tipTable(turn, phone) {
  const t = totalsOf(turn);
  const showCache = !phone;
  const showReason = !phone && t.reasoning > 0;
  const cols = [phone ? "minmax(0, 1fr)" : "max-content", "auto"];
  if (showCache) cols.push("auto");
  cols.push("auto");
  if (showReason) cols.push("auto");
  cols.push("auto");
  const out = (a) => (phone && a.reasoning > 0 ? `${tok(a.output)}<span class="rz">（推理 ${tok(a.reasoning)}）</span>` : tok(a.output));
  const line = (name, a, cls = "", extra = "") => {
    const c = [`<span class="nm ${cls}">${name}${extra}</span>`, `<span class="num ${cls}">${tok(a.input)}</span>`];
    if (showCache) c.push(`<span class="num ${cls}">${tok(a.cache)}</span>`);
    c.push(`<span class="num ${cls}">${out(a)}</span>`);
    if (showReason) c.push(`<span class="num ${cls} ${cls ? "" : "rz"}">${a.reasoning ? tok(a.reasoning) : "—"}</span>`);
    c.push(`<span class="num ${cls} ${a.priced === false ? "none" : ""}">${a.priced === false ? "—" : cost(a.cost)}</span>`);
    return c.join("");
  };
  const hd = ["模型", "输入"];
  if (showCache) hd.push("缓存");
  hd.push("输出");
  if (showReason) hd.push("推理");
  hd.push("估算成本");
  const header = hd.map((h, i) => `<span class="hd ${i ? "num" : ""}">${h}</span>`).join("");
  const rows = turn.rows.map((r) => line(`<span>${esc(r.model)}</span>`, r, "", r.priced ? "" : `<span class="pill warn">无价格</span>`)).join("");
  const total = turn.rows.length >= 2 ? line("合计", t, "tt") : "";
  const unpriced = turn.rows.filter((r) => !r.priced);
  const warn = unpriced.length ? `<span class="warn">${unpriced.map((r) => esc(r.model)).join("、")} 没有价格数据，按 $0 计入。</span>` : "";
  return `<div class="tip tb" data-tip>
    <div class="tb-h"><span class="t">本轮用量</span><span class="d">耗时 ${dur(turn.durationMs)}</span></div>
    <div class="tb-g" style="grid-template-columns:${cols.join(" ")}">${header}${rows}${total}</div>
    <div class="tb-note">估算成本 · 按公开 API 价格计算${warn}</div>
  </div>`;
}
function chatFrame() {
  const sc = screen();
  const f = FRAMES[sc.frame];
  const turn = TURNS[sc.turn];
  const t = totalsOf(turn);
  const tip = !S.tipOpen ? "" : sc.v === "cur" ? tipCurrent(turn) : sc.v === "ov" ? tipOverview(turn) : tipTable(turn, f.phone);
  const segText = `· ↑${tok(t.input)} ↓${tok(t.output)} · `;
  return `<div class="chat">
    <div class="chat-top">${icon("message-square", 14)}<span>整理价格表的列宽</span></div>
    <div class="stream">
      <div class="umsg"><div class="bubble">把价格表的输入框对齐一下，顺便看看悬浮面板为什么是歪的。</div></div>
      <div class="amsg">
        <p>已经看过了。面板外框默认 <code>maxWidth</code> 是 280，内层又要求 <code>minWidth: 280</code>，再加上外框的内边距，内容会溢出边框。</p>
        <p>另外，带推理 token 的行把「（N 推理）」拼进了输出列，这一列只在那一行变宽，所以各行的列对不齐。</p>
      </div>
      <div class="tfoot">
        <span class="ic">${icon("copy", 14)}</span><span class="ic">${icon("split", 14)}</span>
        <span class="worked">已工作 ${dur(turn.durationMs)}</span>
        <span class="seg-wrap"><span class="useg ${S.tipOpen ? "on" : ""}" data-act="tip">${segText}<span class="${t.priced ? "" : "unp"}">${cost(t.cost)}</span></span>${tip}</span>
      </div>
    </div>
  </div>`;
}

// 浮层定位：与 tooltip.tsx 相同——在触发器上方 offset 8，水平居中，夹紧到窗口内 8px
function placeTip() {
  const frame = document.querySelector(".frame");
  const tipEl = document.querySelector("[data-tip]");
  const seg = document.querySelector(".useg");
  if (!frame || !tipEl || !seg) return;
  const scale = frame.getBoundingClientRect().width / frame.offsetWidth || 1;
  const fr = frame.getBoundingClientRect();
  const sr = seg.getBoundingClientRect();
  const tw = tipEl.offsetWidth, th = tipEl.offsetHeight;
  const segX = (sr.left - fr.left) / scale, segY = (sr.top - fr.top) / scale, segW = sr.width / scale;
  let x = segX + (segW - tw) / 2;
  let y = segY - th - 8;
  x = Math.max(8, Math.min(frame.offsetWidth - tw - 8, x));
  y = Math.max(8, y);
  // tip 挂在 seg-wrap 里，换算成相对 seg-wrap 的坐标
  const wrap = tipEl.parentElement.getBoundingClientRect();
  tipEl.style.left = x - (wrap.left - fr.left) / scale + "px";
  tipEl.style.top = y - (wrap.top - fr.top) / scale + "px";
}

// ───────── 外壳 ─────────
function protoBar() {
  const groups = [];
  for (const sc of SCREENS) {
    let g = groups.find((x) => x.name === sc.group);
    if (!g) groups.push((g = { name: sc.group, items: [] }));
    g.items.push(sc);
  }
  return `<div class="proto-bar">
    ${groups.map((g) => `<div class="grp"><span class="grp-label">${g.name}</span>${g.items.map((sc) => `<button class="${sc.id === S.screen ? "on" : ""}" data-screen="${sc.id}">${sc.label}</button>`).join("")}</div>`).join('<span class="sep"></span>')}
    <span class="sep"></span>
    <div class="grp"><span class="grp-label">主题</span><button class="${S.theme === "light" ? "on" : ""}" data-theme="light">亮</button><button class="${S.theme === "dark" ? "on" : ""}" data-theme="dark">暗</button></div>
    <div class="grp"><span class="grp-label">← → 切换画面</span></div>
  </div>`;
}
function render() {
  const sc = screen();
  const f = FRAMES[sc.frame];
  document.body.className = `proto ${S.bare ? "bare" : ""} ${S.theme === "dark" ? "page-dark" : ""}`;
  const inner = f.kind === "settings" ? settingsFrame() : chatFrame();
  const cap = `${sc.group} · ${sc.label}　${f.w}×${f.h}`;
  const root = document.getElementById("root");
  root.innerHTML = `${S.bare ? "" : protoBar()}<div class="proto-stage">
    ${S.bare ? "" : `<div class="proto-caption">${esc(cap)}</div>`}
    ${!S.bare && sc.note ? `<div class="proto-note">${esc(sc.note)}</div>` : ""}
    <div class="frame-holder"><div class="frame-shadow ${f.phone ? "phone" : ""}"><div class="frame theme-${S.theme} ${f.phone ? "phone" : ""}" style="width:${f.w}px;height:${f.h}px">${inner}</div></div></div>
  </div>`;
  fit();
  placeTip();
  const url = new URL(location.href);
  url.searchParams.set("s", S.screen);
  url.searchParams.set("t", S.theme);
  history.replaceState(null, "", url);
}
function fit() {
  if (S.bare) return;
  const holder = document.querySelector(".frame-holder");
  const frame = document.querySelector(".frame");
  const f = FRAMES[screen().frame];
  const avail = window.innerWidth - 48;
  const k = Math.min(1, avail / f.w);
  frame.style.transform = k < 1 ? `scale(${k})` : "";
  holder.style.width = f.w * k + "px";
  holder.style.height = f.h * k + "px";
}

// ───────── 交互 ─────────
document.addEventListener("click", (e) => {
  const scBtn = e.target.closest("[data-screen]");
  if (scBtn) { applyScreen(scBtn.dataset.screen); return render(); }
  const th = e.target.closest("[data-theme]");
  if (th) { S.theme = th.dataset.theme; return render(); }
  const a = e.target.closest("[data-act]");
  if (!a) return;
  const m = a.dataset.m;
  const row = m && P.models.find((x) => x.model === m);
  switch (a.dataset.act) {
    case "lite": P.liteOpen = !P.liteOpen; break;
    case "tip": S.tipOpen = !S.tipOpen; break;
    case "edit": P.editing.add(m); P.drafts[m] = draftOf(row.price); delete P.errors[m]; break;
    case "custom": P.pinned.add(m); P.editing.add(m); P.drafts[m] = draftOf(row.price); P.forceHover = null; break;
    case "cancel":
      P.editing.delete(m); P.pinned.delete(m); delete P.drafts[m]; delete P.errors[m]; break;
    case "save": {
      const price = parseDraft(P.drafts[m]);
      if (!price) { P.errors[m] = "四列都要填数字。"; break; }
      row.price = price; row.priceSource = "override";
      P.editing.delete(m); P.pinned.delete(m); delete P.drafts[m]; delete P.errors[m];
      break;
    }
    case "remove": {
      // 移除自定义价：原本 LiteLLM 有价 → 回到 LiteLLM；原本没价 → 回到待定价
      const orig = PRICE_MODELS_INITIAL.find((x) => x.model === m);
      if (row.origin === "table" && orig?.priceSource === "table") { row.priceSource = "table"; row.price = { ...orig.price }; }
      else if (row.origin === "table") { row.priceSource = "table"; }
      else { row.priceSource = null; row.price = null; P.drafts[m] = draftOf(null); }
      P.editing.delete(m);
      break;
    }
    default: return;
  }
  render();
});
document.addEventListener("input", (e) => {
  const el = e.target;
  if (el.dataset.draft) {
    const m = el.dataset.draft;
    P.drafts[m] = { ...(P.drafts[m] || draftOf(null)), [el.dataset.field]: el.value };
    return;
  }
  if (el.dataset.actInput === "query") {
    P.query = el.value;
    const pos = el.selectionStart;
    render();
    const again = document.querySelector('[data-act-input="query"]');
    again.focus();
    again.setSelectionRange(pos, pos);
  }
});
document.addEventListener("mouseover", (e) => {
  if (e.target.closest(".useg") && !S.tipOpen) { S.tipOpen = true; render(); }
});
document.addEventListener("keydown", (e) => {
  if (e.target.closest("input, textarea, [contenteditable]")) return;
  if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
  const i = SCREENS.findIndex((x) => x.id === S.screen);
  const n = SCREENS.length;
  applyScreen(SCREENS[(i + (e.key === "ArrowRight" ? 1 : n - 1)) % n].id);
  render();
});
window.addEventListener("resize", () => { fit(); placeTip(); });

applyScreen(S.screen);
render();

</script>
</body>
</html>
