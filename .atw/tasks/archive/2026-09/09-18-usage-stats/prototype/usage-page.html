<!--
  PROTOTYPE — 可丢弃。「用量」页原型，UI 照抄参考项目 TokenTracker 的 dashboard
  （dashboard/src/ui/dashboard/{views/DashboardView,components/UsageOverview,StatsPanel,ActivityHeatmap,TrendMonitor,DataDetails,UsageLimitsPanel}.jsx、pages/SessionsPage.jsx）。
  布局：左 4 / 右 8 栅格；左列 = 统计面板 + 热力图 + 使用趋势 + Plan usage；右列 = 用量总览（周期、大数字、来源卡片）+ 数据明细（每日细目/按月/项目用量）。价格表挪到主机设置页（用户 2026-09-18 决定），不在本页。
  在参考项目之外补的东西：Host 筛选、回填进度、每日细目展开会话。
  数据全部为假数据，按 map-issues/08 的 usage.report.get 响应形状生成。
  底部浮动条：桌面/手机宽度、亮/暗、回填状态。
-->
<title>Paseo 用量页原型</title>
<style>
  :root {
    color-scheme: light;
    /* 参考项目 tailwind.config.cjs 的 oai 灰阶（静态中性灰，卡片/描边/文字都走这套） */

    --g100: #f5f5f5;
    --g200: #e5e5e5;
    --g300: #d4d4d4;
    --g400: #a3a3a3;
    --g500: #737373;
    --g600: #525252;
    --g700: #404040;
    --g800: #262626;
    --g900: #171717;
    --page: #eef0ee; /* 窗口底色（styles.css --oai-gray-100 绿调灰，截图里的外框） */

    --card: #ffffff;
    --card-border: var(--g200);
    --card-border-hover: var(--g300);
    --ink: #0a0a0a;
    --ink-muted: var(--g500);
    --ink-faint: var(--g400);
    --ink-2: var(--g600);
    --ink-3: var(--g700);
    --tile: var(--g50);
    --row-hover: rgba(250, 250, 250, 0.5);
    --divider: var(--g100);
    --divider-2: var(--g200);
    --brand: #059669;
    --brand-dark: #047857;
    --amber-bg: #fffbeb;
    --amber-border: rgba(252, 211, 77, 0.7);
    --amber-fg: #b45309;
    --sky-bg: #f0f9ff;
    --sky-fg: #0369a1;
    --emerald-bg: #ecfdf5;
    --emerald-fg: #047857;
    --heat0: #ebedf0;
    --heat1: #a7f3d0;
    --heat2: #6ee7b7;
    --heat3: #34d399;
    --heat4: #10b981;
    --thumb: #ffffff;
    --seg-bg: var(--g100);
    --seg-border: var(--g200);

    --sans:
      "OpenAI Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu,
      sans-serif;
    --mono: "SF Mono", SFMono-Regular, ui-monospace, Menlo, Monaco, Consolas, monospace;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0a0a0a;
    --sidebar-fg: #a3a3a3;
    --card: #171717;
    --card-border: #262626;
    --card-border-hover: #404040;
    --ink: #fafafa;
    --ink-muted: #d4d4d4;
    --ink-faint: #a3a3a3;
    --ink-2: #d4d4d4;
    --ink-3: #e5e5e5;
    --tile: #262626;
    --row-hover: rgba(38, 38, 38, 0.5);
    --divider: #262626;
    --divider-2: #404040;
    --brand: #10b981;
    --brand-dark: #34d399;
    --amber-bg: rgba(245, 158, 11, 0.1);
    --amber-border: rgba(245, 158, 11, 0.3);
    --amber-fg: #fcd34d;
    --sky-bg: rgba(14, 165, 233, 0.1);
    --sky-fg: #7dd3fc;
    --emerald-bg: rgba(16, 185, 129, 0.1);
    --emerald-fg: #6ee7b7;
    --heat0: #121212;
    --heat1: #065f46;
    --heat2: #059669;
    --heat3: #10b981;
    --heat4: #34d399;
    --thumb: #404040;
    --seg-bg: #262626;
    --seg-border: #404040;
    --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.5), 0 4px 6px -4px rgba(0, 0, 0, 0.5);
  }
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font: 14px/1.5 var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  button {
    font: inherit;
    color: inherit;
    background: none;
    border: 0;
    padding: 0;
    cursor: pointer;
  }
  .num {
    font-variant-numeric: tabular-nums;
  }
  .mono {
    font-family: var(--mono);
  }
  svg.i {
    width: 15px;
    height: 15px;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.75;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex: none;
  }

  /* ---- 外壳：参考项目 Mac 原生壳（灰底 + 白色圆角主卡） ---- */
  #frame {

    height: 100vh;
    margin: 0 auto;
    overflow: hidden;
  }
  #frame.mobile {
    max-width: 390px;
  }
  .sidebar {

    flex: none;
    padding: 20px 12px 12px;

  }
  .sidebar .brand {

    color: var(--g500);
  }

  }
  .nav {
    display: flex;
    align-items: center;
    gap: 8px;

    color: var(--ink);

  }

    height: 20px;

    align-items: center;
    justify-content: center;
  }
  .main {
    flex: 1;
    min-width: 0;
    margin: 12px 12px 12px 0;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  #frame.mobile .main {
    margin: 0;
    border-radius: 0;
    border: 0;
  }
  .topbar {
    display: none;
    align-items: center;
    gap: 8px;
    height: 56px;
    padding: 0 12px;
    border-bottom: 1px solid var(--card-border);
  }
  #frame.mobile .topbar {
    display: flex;
  }
  .scroll {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
  }
  .page {
    padding: 24px;
  }
  #frame.mobile .page {
    padding: 12px;
  }
  .grid12 {
    display: grid;
    grid-template-columns: repeat(12, minmax(0, 1fr));
    gap: 16px;
  }
  .col4 {
    grid-column: span 4;
    display: flex;
    flex-direction: column;
    gap: 16px;
    min-width: 0;
  }
  .col8 {
    grid-column: span 8;
    display: flex;
    flex-direction: column;
    gap: 16px;
    min-width: 0;
  }
  .col4 > .card:last-child,
  .col8 > .card:last-child {
    flex: 1;
  }
  .col8 > .card:last-child {
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .col8 > .card:last-child .tablewrap {
    flex: 1;
    max-height: none;
    min-height: 384px;
  }
  #frame.mobile .grid12 {
    grid-template-columns: 1fr;
  }
  #frame.mobile .col4,
  #frame.mobile .col8 {
    grid-column: span 1;
  }
  #frame.mobile .col4 {
    order: 2;
  }
  #frame.mobile .col8 {
    order: 1;
  }

  /* ---- Card（ui/components/Card.jsx） ---- */
  .card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 20px;
    transition: border-color 0.15s;
  }
  .card:hover {
    border-color: var(--card-border-hover);
  }
  .ctitle {
    font-size: 14px;
    font-weight: 500;
    color: var(--ink-muted);
    text-transform: uppercase;
    letter-spacing: 0.025em;
    margin: 0;
  }
  .chead {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 12px;
  }
  .cap {
    font-size: 12px;
    color: var(--ink-faint);
  }

  /* ---- 分段/页签（UsageOverview tabClass、SegmentedControl） ---- */
  .tabs {
    display: flex;
    gap: 4px;
    flex: 1;
    min-width: 0;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar {
    display: none;
  }
  .tab {
    flex: none;
    white-space: nowrap;
    font-size: 12px;
    font-weight: 500;
    padding: 6px 12px;
    border-radius: 6px;
    color: var(--ink-muted);
    transition:
      color 0.15s,
      background 0.15s;
  }
  .tab:hover {
    color: var(--ink);
    background: var(--g50);
  }
  :root[data-theme="dark"] .tab:hover {
    background: #262626;
  }
  .tab.on {
    color: var(--ink);
    background: var(--g100);
  }
  :root[data-theme="dark"] .tab.on {
    background: #262626;
  }
  .seg {
    position: relative;
    display: inline-flex;
    height: 32px;
    align-items: center;
    gap: 4px;
    border-radius: 6px;
    border: 1px solid var(--seg-border);
    background: var(--seg-bg);
    padding: 3px;
  }
  .seg button {
    height: 24px;
    padding: 0 10px;
    border-radius: 4px;
    font-size: 12px;
    font-weight: 500;
    color: var(--ink-muted);
  }
  .seg button.on {
    background: var(--thumb);
    color: var(--ink);
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
  }
  .seg.tiny {
    height: auto;
    padding: 2px;
    border-radius: 6px;
  }
  .seg.tiny button {
    height: auto;
    padding: 2px 8px;
    font-size: 10px;
  }
  .obtn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    height: 32px;
    padding: 0 12px;
    font-size: 12px;
    font-weight: 500;
    border-radius: 6px;
    border: 1px solid var(--g300);
    background: var(--card);
    color: var(--ink);
    transition:
      color 0.15s,
      border-color 0.15s;
    white-space: nowrap;
  }
  :root[data-theme="dark"] .obtn {
    border-color: #404040;
  }
  .obtn:hover {
    border-color: var(--brand);
    color: var(--brand);
  }
  .obtn.sq {
    width: 32px;
    padding: 0;
  }
  .obtn svg {
    width: 14px;
    height: 14px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .obtn.ghost {
    border: 0;
    color: var(--ink-faint);
  }
  .obtn.ghost:hover {
    background: var(--g100);
    color: var(--ink-3);
  }
  .pillamber {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    max-width: 360px;
    border-radius: 999px;
    border: 1px solid var(--amber-border);
    background: var(--amber-bg);
    padding: 6px 12px;
    font-size: 12px;
    color: var(--amber-fg);
    white-space: nowrap;
  }
  .pillamber .dot {
    position: relative;
    width: 6px;
    height: 6px;
    flex: none;
  }
  .pillamber .dot::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: #fbbf24;
    opacity: 0.75;
    animation: ping 1.2s cubic-bezier(0, 0, 0.2, 1) infinite;
  }
  .pillamber .dot::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: #f59e0b;
  }
  @keyframes ping {
    75%,
    100% {
      transform: scale(2.2);
      opacity: 0;
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .pillamber .dot::before {
      animation: none;
    }
  }
  .tag {
    display: inline-flex;
    align-items: center;
    border-radius: 999px;
    padding: 2px 8px;
    font-size: 11px;
    font-weight: 500;
    white-space: nowrap;
    line-height: 1.4;
  }
  .tag.sky {
    background: var(--sky-bg);
    color: var(--sky-fg);
  }
  .tag.em {
    background: var(--emerald-bg);
    color: var(--emerald-fg);
  }
  .tag.amb {
    background: var(--amber-bg);
    color: var(--amber-fg);
    border: 1px solid var(--amber-border);
  }
  .tag.gray {
    border: 1px solid var(--g200);
    color: var(--ink-2);
  }
  :root[data-theme="dark"] .tag.gray {
    border-color: #404040;
  }
  .menu {
    position: absolute;
    top: 36px;
    right: 0;
    z-index: 30;
    min-width: 240px;
    padding: 4px 0;
    border-radius: 8px;
    border: 1px solid var(--card-border);
    background: var(--card);
    box-shadow: var(--shadow-lg);
    display: none;
  }
  .menu.open {
    display: block;
  }
  .menu .item {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    padding: 7px 12px;
    font-size: 13px;
    text-align: left;
    color: var(--ink-2);
  }
  .menu .item:hover:not([disabled]) {
    background: var(--g100);
    color: var(--ink);
  }
  :root[data-theme="dark"] .menu .item:hover:not([disabled]) {
    background: #262626;
  }
  .menu .item[disabled] {
    cursor: default;
    color: var(--ink-faint);
  }
  .menu .item .sp {
    flex: 1;
  }
  .menu .item .d {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--g400);
  }
  .menu .item .d.ok {
    background: #10b981;
  }

  /* ---- 统计面板（StatsPanel） ---- */
  .tiles {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 8px;
  }
  #frame.mobile .tiles {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .tile {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 8px;
    background: var(--tile);
    border-radius: 8px;
    min-width: 0;
  }
  .tile .v {
    font-size: 14px;
    font-weight: 600;
    color: var(--ink);
    white-space: nowrap;
  }
  .tile .k {
    font-size: 10px;
    color: var(--ink-faint);
    margin-top: 2px;
    white-space: nowrap;
  }
  .rank {
    display: flex;
    align-items: center;
    padding: 8px 0;
  }
  .rank + .rank {
    border-top: 1px solid var(--divider);
  }
  .rank .n {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--g100);
    color: var(--ink-muted);
    font-size: 10px;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex: none;
  }
  :root[data-theme="dark"] .rank .n {
    background: #262626;
  }
  .rank .name {
    flex: 1;
    padding: 0 10px;
    font-size: 14px;
    color: var(--ink-3);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .rank .pct {
    font-size: 14px;
    font-weight: 600;
    color: var(--ink);
  }
  .sep {
    border-top: 1px solid var(--divider);
    margin-top: 16px;
    padding-top: 12px;
  }
  .foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
    color: var(--ink-faint);
  }
  .foot b {
    font-weight: 400;
    color: var(--ink-muted);
    margin-left: 6px;
  }

  /* ---- 用量总览（UsageOverview） ---- */
  .ovhead {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 24px;
  }
  .ovhead .r {
    display: flex;
    align-items: center;
    gap: 6px;
    flex: none;
    position: relative;
  }
  .hero {
    text-align: center;
    margin-bottom: 32px;
  }
  .hero .lbl {
    font-size: 12px;
    color: var(--ink-muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 12px;
  }
  .hero .big {
    font-size: 72px;
    line-height: 1;
    font-weight: 700;
    letter-spacing: -0.025em;
    color: var(--ink);
  }
  #frame.mobile .hero .big {
    font-size: 48px;
  }
  .hero .cost {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 16px;
    font-size: 20px;
    font-weight: 700;
    color: var(--brand);
  }
  .hero .cost svg {
    width: 16px;
    height: 16px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
    opacity: 0.8;
  }
  .hero .rng {
    margin-top: 12px;
    font-size: 11px;
    line-height: 1.35;

    align-items: center;
    gap: 4px;

  .dist {

    border-radius: 999px;

    display: flex;

    display: block;

    border-color: var(--g300);

    height: 15px;
    flex: none;

    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 12px;
    line-height: 1;

    width: 15px;
    height: 15px;
  }

    margin-top: 24px;

    display: flex;

    margin-bottom: 12px;

    font-weight: 500;

  .mrow {
    margin-bottom: 12px;

    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(8rem, max-content) minmax(5.5rem, max-content) 4rem;

    color: var(--ink-3);

    text-align: right;

  }
  function hostFilter() {
    const sel = state.hostId === "all" ? "全部主机" : HOSTS.find((h) => h.id === state.hostId).name;
    const item = (h) => {
      const dim = h.state !== "ok";
      const badge =
        h.state === "needs-update"
          ? '<span class="tag amb">需要更新主机</span>'
          : h.state === "offline"
            ? '<span class="tag gray">未计入</span>'
            : "";
      return `<button class="item" data-host="${h.id}" ${dim ? "disabled" : ""}><span class="d ${h.state === "offline" ? "" : "ok"}"></span>${esc(h.name)}<span class="sp"></span>${badge}</button>`;
    };
    return `<button class="obtn" id="hostPill"><svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="8" rx="2"/><rect x="2" y="13" width="20" height="8" rx="2"/></svg>${esc(sel)}<svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
    <div class="menu" id="hostMenu"><button class="item" data-host="all"><span class="d ok"></span>全部主机<span class="sp"></span><span class="tag gray">2 台计入</span></button>${HOSTS.map(item).join("")}</div>`;
  }
  function overview(r) {
    const rg = range();
    const s = r.summary;
    const b = backfill();
    const P = [
      ["day", "日"],
      ["week", "周"],
      ["month", "月"],
      ["all", "总计"],
      [
        "custom",
        state.period === "custom"
          ? `${state.custom.from.slice(5).replace("-", "/")} — ${state.custom.to.slice(5).replace("-", "/")}`
          : "自定义",
      ],
    ];
    const tabs = `<div class="tabs">${P.map(([k, l]) => `<button class="tab ${state.period === k ? "on" : ""}" data-period="${k}">${l}</button>`).join("")}</div>`;
    const nav =
      state.period === "all" || state.period === "custom"
        ? ""
        : `<button class="obtn ghost sq" data-shift="-1" title="上一个"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button><button class="obtn ghost sq" data-shift="1" title="下一个" ${state.anchor >= TODAY ? 'disabled style="opacity:.4"' : ""}><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>`;
    const bf =
      b.state === "running"
        ? `<span class="pillamber num" title="已读取 ${b.filesDone} / ${b.filesTotal} 个日志文件，最近的日期先补齐"><span class="dot"></span>回填中 ${b.filesDone.toLocaleString()} / ${b.filesTotal.toLocaleString()}</span>`
        : "";
    const dist = `<div class="dist">${r.sources.map((x) => `<i style="width:${(x.share * 100).toFixed(2)}%;background:${x.color}" title="${esc(x.label)}: ${fmtPct(x.share)}"></i>`).join("")}</div>`;
    const cards = `<div class="srcgrid">
    <button class="srccard ${state.srcPick === "all" ? "on" : ""}" data-src="all"><div class="h">${allIcon}<span>全部</span></div><div class="pct num">100.00%</div><div class="mc num">${new Set(r.models.map((m) => m.model)).size} 个模型</div></button>
    ${r.sources.map((x) => `<button class="srccard ${state.srcPick === x.key ? "on" : ""}" data-src="${x.key}"><div class="h">${srcIcon(x)}<span title="${esc(x.label)}">${esc(x.label)}</span></div><div class="pct num">${x.share < 0.0001 ? "<0.01%" : fmtPct(x.share)}</div><div class="mc num">${x.modelCount} 个模型</div></button>`).join("")}
  </div>`;
    let models = "";
    if (state.srcPick) {
      const list =
        state.srcPick === "all" ? r.models : r.models.filter((m) => m.src.key === state.srcPick);
      const src = state.srcPick === "all" ? null : SOURCES.find((x) => x.key === state.srcPick);
      const denom = list.reduce((a, m) => a + total(m.totals), 0) || 1;
      const max = total(list[0]?.totals || zero()) || 1;
      models = `<div class="models"><div class="mh">${src ? srcIcon(src, 14) : allIcon}${src ? esc(src.label) : "全部"} · 模型明细</div>
      ${list.map((m) => `<div class="mrow"><div class="l"><span class="n" title="${esc(m.model)}">${esc(m.model)}${m.priced ? "" : ' <span class="tag amb">无价格数据</span>'}</span><span class="t num">${fmtTok(total(m.totals))} tokens</span><span class="c num">${fmtUsd(m.estimatedCost)}</span><span class="p num">${((total(m.totals) / denom) * 100).toFixed(1)}%</span></div><div class="bar"><i style="width:${((total(m.totals) / max) * 100).toFixed(1)}%;background:${src ? src.color : m.src.color}"></i></div></div>`).join("")}</div>`;
    }
    return `<div class="card">
    <div class="ovhead">${tabs}<div class="r">${nav}${bf}${hostFilter()}<button class="obtn sq" title="刷新"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 3v6h-6"/></svg></button></div></div>
    ${state.period === "custom" ? `<div style="display:flex;justify-content:center;gap:8px;margin:-8px 0 16px"><input class="oinput" style="width:130px;text-align:left" type="date" id="cFrom" value="${state.custom.from}" max="${TODAY}"><input class="oinput" style="width:130px;text-align:left" type="date" id="cTo" value="${state.custom.to}" max="${TODAY}"></div>` : ""}
    <div class="hero"><div class="lbl">Token 总数</div><div class="big num" title="${fmtFull(total(s.totals))}">${fmtFull(total(s.totals))}</div>
      <div><span class="cost num">${fmtUsd(s.estimatedCost)}<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg></span></div>
      <div class="rng num"><span>${rg.label}</span><span>估算成本 · 按公开 API 价格计算</span></div></div>
    ${dist}${cards}${models}
  </div>`;
  }
  function sessionList(d) {
    return `<ul class="sess">${d.sessions
      .slice()
      .sort((a, b) => (a.firstAt < b.firstAt ? 1 : -1))
      .map(
        (s) => `<li>
    <div class="lt"><span class="ic">${srcIcon(s.src, 14)}</span><div style="min-width:0;flex:1">
      <div class="t1"><span class="n">${esc(s.title)}</span><span class="tag ${s.src.kind === "claude" ? "em" : "sky"}">${esc(s.src.label)}</span>${state.hostId === "all" ? hostBadge(s.serverId) : ""}</div>
      <div class="t2"><span>${esc(s.proj.displayName)}</span><span class="mono">${esc(s.model)}</span><span class="num">${s.firstAt.slice(5).replace("T", " ").replace("-", "/")}</span><span class="num">${fmtDur(s.durationMs)}</span></div>
      <div class="t3 num">↑ ${fmtFull(s.tokens.input + s.tokens.cachedInput + s.tokens.cacheWrite)} · ↓ ${fmtFull(s.tokens.output)} · 缓存 ${fmtFull(s.tokens.cachedInput)}</div>
    </div></div>
    <div class="rt"><dl><div><dd class="num">${fmtTok(total(s.tokens))}</dd><dt>Token</dt></div><div><dd class="num">${fmtUsd(s.estimatedCost)}</dd><dt>成本</dt></div><div class="w10"><dd class="num">${s.turns}</dd><dt>轮次</dt></div></dl><button class="resume"><svg viewBox="0 0 24 24"><path d="M4 17l6-5-6-5M12 19h8"/></svg><span>打开</span></button></div>
  </li>`,
      )
      .join("")}</ul>`;
  }
  function details(r) {
    const T = [
      ["daily", "每日细目"],
      ["monthly", "按月"],
      ["projects", "项目用量"],
    ];
    const tabs = `<div class="tabs" style="flex:none">${T.map(([k, l]) => `<button class="tab ${state.detailTab === k ? "on" : ""}" data-dtab="${k}">${l}</button>`).join("")}</div>`;
    let body = "";
    if (state.detailTab === "daily") {
      body = r.days.length
        ? `<div class="tablewrap"><table><thead><tr><th>日期 <span class="si">▼</span></th><th>总计</th><th>输入</th><th>输出</th><th>缓存</th><th>推理</th><th>会话</th><th>估算成本</th></tr></thead><tbody>
      ${r.days
        .map((d) => {
          const open = state.openDays.has(d.day);
          return `<tr class="dayrow ${open ? "open" : ""}" data-day="${d.day}"><td class="date num"><svg class="chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>${d.day}</td><td class="tot num">${fmtFull(total(d.totals))}</td><td class="num">${fmtFull(d.totals.input)}</td><td class="num">${fmtFull(d.totals.output)}</td><td class="num">${fmtFull(d.totals.cachedInput)}</td><td class="num">${fmtFull(d.totals.reasoning)}</td><td class="num">${d.sessionCount}</td><td class="num">${fmtUsd(d.estimatedCost)}</td></tr>${open ? `<tr class="sub"><td colspan="8">${sessionList(d)}</td></tr>` : ""}`;
        })
        .join("")}
    </tbody></table></div>`
        : '<div class="empty">此周期没有用量</div>';
    } else if (state.detailTab === "monthly") {
      body = r.months.length
        ? `<div class="tablewrap"><table><thead><tr><th>月份</th><th>总计</th><th>输入</th><th>输出</th><th>缓存</th><th>会话</th><th>估算成本</th></tr></thead><tbody>
      ${r.months.map((m) => `<tr><td class="date num">${m.month}</td><td class="tot num">${fmtFull(total(m.totals))}</td><td class="num">${fmtFull(m.totals.input)}</td><td class="num">${fmtFull(m.totals.output)}</td><td class="num">${fmtFull(m.totals.cachedInput)}</td><td class="num">${m.sessionCount}</td><td class="num">${fmtUsd(m.estimatedCost)}</td></tr>`).join("")}
    </tbody></table></div>`
        : '<div class="empty">此周期没有用量</div>';
    } else {
      const list = r.projects.slice(0, state.projLimit);
      const max = total(list[0]?.totals || zero()) || 1;
      const multi = state.hostId === "all";
      body = list.length
        ? `<div style="display:flex;flex-direction:column;gap:4px">${list
            .map((p) => {
              const k = p.rootPath + "|" + p.serverId;
              const open = state.openProjects.has(k);
              return `<button class="prow" data-proj="${esc(k)}"><span class="pav" style="background:${p.av}">${esc(p.displayName[0].toUpperCase())}</span><div style="min-width:0;flex:1"><div style="display:flex;align-items:baseline;gap:0;min-width:0">${p.owner ? `<span class="po">${esc(p.owner)}/</span>` : ""}<span class="pn">${esc(p.displayName)}</span>${multi ? `<span style="margin-left:8px">${hostBadge(p.serverId)}</span>` : ""}${p.kind !== "git" ? `<span class="tag gray" style="margin-left:8px">${p.kind === "directory" ? "目录" : "非 git"}</span>` : ""}</div><div class="ps">${p.sources.map((s) => srcIcon(s, 12)).join("")}</div></div><div class="pr"><b class="num">${fmtTok(total(p.totals))}</b><span class="bar"><i style="width:${Math.max(2, (total(p.totals) / max) * 100).toFixed(1)}%"></i></span></div></button>${open ? `<div class="cwds">${p.cwds.map((c) => `<div><span class="mono">${esc(c.cwd)}</span><span class="num">${fmtTok(total(c.totals))} · ${fmtUsd(c.estimatedCost)}</span></div>`).join("")}</div>` : ""}`;
            })
            .join("")}</div>`
        : '<div class="empty">此周期没有用量</div>';
    }
    const right =
      state.detailTab === "projects"
        ? `<span class="seg tiny"><button data-plim="3" class="${state.projLimit === 3 ? "on" : ""}">前 3</button><button data-plim="6" class="${state.projLimit === 6 ? "on" : ""}">前 6</button><button data-plim="10" class="${state.projLimit === 10 ? "on" : ""}">前 10</button></span>`
        : "";
    return `<div class="card"><div class="chead" style="margin-bottom:${state.detailTab === "projects" ? 16 : 0}px;align-items:center">${tabs}${right}</div>${body}</div>`;
  }

  function render() {
    const r = buildReport({ ...range(), hostId: state.hostId });
    document.getElementById("page").innerHTML = `<div class="grid12">
    <div class="col4">${statsPanel(r)}${heatmap(state.hostId)}${trend(r)}${planUsage()}</div>
    <div class="col8">${overview(r)}${details(r)}</div>
  </div>`;
    document.getElementById("bfToggle").textContent =
      `回填: ${state.backfill === "running" ? "进行中" : "已完成"}`;
    document.getElementById("wDesktop").classList.toggle("on", state.width === "desktop");
    document.getElementById("wMobile").classList.toggle("on", state.width === "mobile");
    document.getElementById("frame").className = state.width;
    window.__report = r;
  }

  // ============ 交互 ============
  const page = document.getElementById("page");
  page.addEventListener("click", (e) => {
    const t = e.target.closest(
      "[data-period],[data-shift],[data-host],[data-src],[data-dtab],[data-plim],[data-day],[data-proj],#hostPill",
    );
    if (!t) return;
    if (t.dataset.period) {
      state.period = t.dataset.period;
      if (state.period !== "custom") state.anchor = TODAY;
      render();
      return;
    }
    if (t.dataset.shift) {
      const d = Number(t.dataset.shift);
      if (state.period === "day") state.anchor = addDays(state.anchor, d);
      else if (state.period === "week") state.anchor = addDays(state.anchor, 7 * d);
      else {
        const f = state.anchor.slice(0, 7) + "-01";
        state.anchor =
          d > 0 ? addDays(f, 32).slice(0, 7) + "-01" : addDays(f, -1).slice(0, 7) + "-01";
      }
      if (state.anchor > TODAY) state.anchor = TODAY;
      render();
      return;
    }
    if (t.dataset.host) {
      state.hostId = t.dataset.host;
      render();
      return;
    }
    if (t.dataset.src) {
      state.srcPick = state.srcPick === t.dataset.src ? null : t.dataset.src;
      render();
      return;
    }
    if (t.dataset.dtab) {
      state.detailTab = t.dataset.dtab;
      render();
      return;
    }
    if (t.dataset.plim) {
      state.projLimit = Number(t.dataset.plim);
      render();
      return;
    }
    if (t.dataset.day) {
      const k = t.dataset.day;
      state.openDays.has(k) ? state.openDays.delete(k) : state.openDays.add(k);
      render();
      return;
    }
    if (t.dataset.proj) {
      const k = t.dataset.proj;
      state.openProjects.has(k) ? state.openProjects.delete(k) : state.openProjects.add(k);
      render();
      return;
    }
    if (t.id === "hostPill") {
      document.getElementById("hostMenu").classList.toggle("open");
    }
  });
  page.addEventListener("change", (e) => {
    if (e.target.id === "cFrom") {
      state.custom.from = e.target.value;
      render();
    }
    if (e.target.id === "cTo") {
      state.custom.to = e.target.value;
      render();
    }
  });
  document.addEventListener("click", (e) => {
    if (!e.target.closest("#hostPill"))
      document.getElementById("hostMenu")?.classList.remove("open");
  });
  const tip = document.getElementById("tip");
  page.addEventListener("mousemove", (e) => {
    const t = e.target.closest("[data-tip]");
    if (!t) {
      tip.style.display = "none";
      return;
    }
    let html = "";
    if (t.dataset.tip === "heat") {
      const v = Number(t.dataset.v);
      html = `<div class="h"><span>${t.dataset.day}</span></div><div class="big num">${v ? fmtFull(v) : "0"}<span class="u">tokens</span></div>`;
    } else {
      const k = t.dataset.key;
      const isMonth = k.length === 7;
      const p = {};
      for (const s of SESSIONS) {
        if (state.hostId !== "all" && s.serverId !== state.hostId) continue;
        if ((isMonth ? s.day.slice(0, 7) : s.day) !== k) continue;
        p[s.src.key] = (p[s.src.key] || 0) + total(s.tokens);
      }
      const tot = Object.values(p).reduce((a, b) => a + b, 0);
      html = `<div class="h"><span>${k}</span><span style="font-weight:400">${k > TODAY ? "预测" : ""}</span></div><div class="big num">${fmtFull(tot)}<span class="u">tokens</span></div>${SOURCES.filter(
        (s) => p[s.key],
      )
        .map(
          (s) =>
            `<div class="l"><span><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${s.color};margin-right:6px"></span>${esc(s.label)}</span><b class="num">${fmtTok(p[s.key])}</b></div>`,
        )
        .join("")}`;
    }
    tip.innerHTML = html;
    tip.style.display = "block";
    tip.style.left = Math.min(e.clientX + 14, window.innerWidth - tip.offsetWidth - 8) + "px";
    tip.style.top = Math.min(e.clientY + 14, window.innerHeight - tip.offsetHeight - 8) + "px";
  });
  page.addEventListener("mouseleave", () => (tip.style.display = "none"));
  document.getElementById("wDesktop").onclick = () => {
    state.width = "desktop";
    render();
  };
  document.getElementById("wMobile").onclick = () => {
    state.width = "mobile";
    render();
  };
  const setTheme = (t) => {
    document.documentElement.setAttribute("data-theme", t);
    document.getElementById("thLight").classList.toggle("on", t === "light");
    document.getElementById("thDark").classList.toggle("on", t === "dark");
  };
  document.getElementById("thLight").onclick = () => setTheme("light");
  document.getElementById("thDark").onclick = () => setTheme("dark");
  document.getElementById("bfToggle").onclick = () => {
    state.backfill = state.backfill === "running" ? "done" : "running";
    render();
  };
  setTheme("light");
  render();
</script>
