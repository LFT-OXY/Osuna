npmRebuild: false
# appId 与签名证书共同构成更新身份，改动它会让所有已装副本停止自动更新。
appId: com.chinhae.osuna.desktop
productName: Osuna
executableName: Osuna
protocols:
  - name: Osuna agent link
    schemes:
      - osuna
afterPack: ./scripts/after-pack.js
afterSign: ./scripts/after-sign.js
directories:
  output: release
files:
  - dist/**/*
  - "!**/*.map"
  - "!node_modules/@osuna/*/src/**"
  - "!node_modules/@osuna/**/*.test.*"
  - "!node_modules/@osuna/**/*.spec.*"
  - "!node_modules/@osuna/server/dist/server/web-ui/**"
  # Workspace packages are symlinked, so anything a dev generates inside them
  # lands in the asar. CI never has these; a local .debug run adds gigabytes.
  - "!node_modules/@osuna/*/.debug/**"
  - "!node_modules/@osuna/*/.tasks/**"
  - "!node_modules/@osuna/*/conversations/**"
  - "!node_modules/@osuna/*/test-results/**"
asarUnpack:
  - dist/daemon/node-entrypoint-runner.js
  - node_modules/@osuna/server/dist/server/terminal/shell-integration/**/*
extraResources:
  - from: ../app/dist
    to: app-dist
  - from: assets/editor-targets
    to: editor-target-icons
# Fork 分发：更新源必须指向本仓库。electron-builder 把这段烘进安装包内的
# app-update.yml，指回上游会让团队成员被静默升级成官方版。
publish:
  provider: github
  owner: LFT-OXY
  repo: Osuna
mac:
  artifactName: "Osuna-${version}-${arch}.${ext}"
  minimumSystemVersion: "13.0.0"
  category: public.app-category.developer-tools
  icon: assets/icon.icns
  # 必须关掉。ad-hoc 签名没有 Team ID，而强化运行时会强制库验证，要求进程与它
  # 加载的库 Team ID 一致——结果是应用连自己的 Electron Framework 都加载不了，
  # 启动即崩（v0.8.1 实测）。有正式证书时才能打开它。
  hardenedRuntime: false
  # 本 fork 没有 Apple Developer 账号，不公证。CI 用自签证书签名（ADR 0001），
  # 签名钩子只在 CI 注入，本地构建不签名。
  notarize: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  extraResources:
    - from: bin/osuna
      to: bin/osuna
    - from: assets/icon.png
      to: icon.png
  target:
    - dmg
    - zip
linux:
  category: Development
  icon: assets
  artifactName: "Osuna-${version}-${arch}.${ext}"
  maintainer: "oxy <oxy.chinhae@gmail.com>"
  vendor: "Osuna"
  extraResources:
    - from: bin/osuna
      to: bin/osuna
  target:
    - AppImage
    - deb
    - rpm
    - tar.gz
deb:
  afterInstall: scripts/linux-sandbox/after-install.tpl
rpm:
  afterInstall: scripts/linux-sandbox/after-install.tpl
appImage:
  # A nonempty argument list replaces builder's hardcoded --no-sandbox default.
  executableArgs: ["--class=Osuna"]
  # Keep the AppImage filename stable across versions (no ${version}) so
  # electron-updater overwrites the file in place instead of renaming it to a new
  # versioned path. A rename orphans the old binary, breaks desktop shortcuts, and
  # dangles the ~/.local/bin/osuna CLI symlink, which points at $APPIMAGE. The
  # version stays discoverable via the release tag and the in-app version.
  artifactName: "Osuna-${arch}.${ext}"
win:
  artifactName: "Osuna-Setup-${version}-${arch}.${ext}"
  icon: assets/icon.ico
  extraResources:
    - from: bin/osuna.cmd
      to: bin/osuna.cmd
  target:
    - target: nsis
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
